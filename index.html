<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лідген</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
:root { --bg: #F4F4F1; --card: #FFFFFF; --ink: #0F0F10; --muted: #6B6B70; --soft: #8C8C91; --line: #E6E5E0; --chip: #E9E8E3; --ring: #C9C8C2;
  --acc: #2D5BFF; --acc-soft: #E8EEFF; --red: #C62828; --red-soft: #FDECEC; --amb: #9A6A00; --amb-soft: #FFF4D6; --grn: #1F9D55; --grn-soft: #E6F5EC;
  --on-red: #FFFFFF; --now-btn: rgba(255,255,255,.14); --sh: 0 1px 2px rgba(15,15,16,.05), 0 10px 28px rgba(15,15,16,.07); --shade: rgba(15,15,16,.32);
  --f: "Inter Tight", "Helvetica Neue", Arial, system-ui, sans-serif; }
:root.dark { --bg: #0C0C0E; --card: #18181B; --ink: #F2F1EE; --muted: #A1A1A8; --soft: #7C7C83; --line: #2A2A2F; --chip: #26262B; --ring: #4A4A50;
  --acc: #5B7FFF; --acc-soft: #1C2340; --red: #FF6B6B; --red-soft: #3A1A1A; --amb: #F2C14E; --amb-soft: #2B2416; --grn: #4CC47E; --grn-soft: #15291D;
  --on-red: #0C0C0E; --now-btn: rgba(0,0,0,.09); --sh: 0 10px 30px rgba(0,0,0,.35); --shade: rgba(0,0,0,.55); color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--f); }
body { min-height: 100vh; }
button, input, textarea, select { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
a { color: var(--acc); text-decoration: none; }
[hidden] { display: none !important; }
.red { color: var(--red); } .amb { color: var(--amb); } .grn { color: var(--grn); }
main { max-width: 560px; margin: 0 auto; padding: 18px 16px 108px; }
.load { color: var(--muted); padding: 80px 0; text-align: center; }
.ld { background: var(--card); border-radius: 18px; margin-top: 10px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.noacc { padding: 96px 8px 0; text-align: center; display: grid; gap: 12px; justify-items: center; }
.noacc .ic { font-size: 40px; }
.noacc h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.noacc p { margin: 0 0 12px; color: var(--muted); max-width: 300px; line-height: 1.45; }
.noacc small { font-size: 11.5px; color: var(--soft); }

nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--card); border-top: 1px solid var(--line); padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
nav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; color: var(--soft); font-size: 11.5px; font-weight: 600; position: relative; text-align: center; }
nav button.on { color: var(--ink); }
.badge { position: absolute; top: 1px; left: 54%; min-width: 18px; height: 18px; border-radius: 9px; background: var(--acc); color: #fff; font-size: 11.5px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
.badge.r { background: var(--red); color: var(--on-red); }
.toast { position: fixed; left: 50%; top: 12px; transform: translate(-50%, -160px); background: var(--ink); color: var(--bg); padding: 0 16px; min-height: 44px; display: flex; align-items: center;
  border-radius: 14px; font-size: 15px; font-weight: 500; visibility: hidden; transition: transform .25s, visibility 0s .25s; z-index: 25; max-width: calc(100% - 32px); line-height: 1.3; }
.toast.on { transform: translate(-50%, 0); visibility: visible; transition: transform .25s; }
.toast span { padding: 11px 0; }

.hd { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; }
.hd > div { min-width: 0; }
.lbl { font-size: 13px; font-weight: 500; color: var(--muted); }
h1 { margin: 4px 0 0; font-size: 34px; font-weight: 400; letter-spacing: -.035em; line-height: 1; }
.ib { width: 44px; height: 44px; border-radius: 14px; background: var(--card); display: grid; place-items: center; flex: none; color: var(--ink); }
.st { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.st.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.st > * { background: var(--card); border-radius: 16px; min-height: 64px; padding: 10px 12px; display: grid; align-content: center; gap: 2px; min-width: 0; text-align: left; }
.st.c4 > * { padding: 10px; }
@media (max-width: 380px) { .st > * { padding: 10px; } }
.st b { font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.st b small { font-size: 13px; font-weight: 500; color: var(--soft); letter-spacing: 0; }
.st span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st .on { background: var(--ink); color: var(--bg); }
.st .on b, .st .on span, .st .on b small { color: inherit; } .st .on span, .st .on b small { opacity: .7; }
.sec { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 20px 2px 8px; min-height: 24px; }
.sec b { font-size: 13px; font-weight: 600; color: var(--muted); }
.sec span { font-size: 13px; color: var(--soft); }
.list { display: grid; gap: 8px; }
.more { display: grid; place-items: center; width: 100%; min-height: 48px; border-radius: 16px; background: var(--chip); color: var(--ink); font-size: 15px; font-weight: 600; text-align: center; margin-top: 8px; }
.empty { background: var(--card); border-radius: 24px; padding: 44px 24px; text-align: center; }
.empty b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -.02em; } .empty p { margin: 6px 0 0; color: var(--muted); }
.s13 { font-size: 13px; color: var(--muted); }
.src0 { font-size: 13px; color: var(--soft); text-align: center; margin-top: 10px; }
.mchip { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--chip); color: var(--muted); white-space: nowrap; flex: none; }
.mchip.blue { background: var(--acc-soft); color: var(--acc); } .mchip.red { background: var(--red-soft); color: var(--red); }
.mchip.amb { background: var(--amb-soft); color: var(--amb); } .mchip.grn { background: var(--grn-soft); color: var(--grn); } .mchip.ink { background: var(--ink); color: var(--bg); }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.b { display: grid; place-items: center; grid-auto-flow: column; gap: 7px; min-height: 52px; border-radius: 16px; font-size: 15px; font-weight: 600; text-align: center; background: var(--card); border: 1px solid var(--line); color: var(--ink); padding: 0 10px; width: 100%; }
.b.pri { background: var(--acc); border-color: var(--acc); color: #fff; }
.b.ink { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.b.mut { color: var(--muted); }
.b.w2 { grid-column: 1 / -1; }
.b:disabled { opacity: .6; }

.stack { position: relative; margin-top: 14px; }
.ghost { position: absolute; left: 12px; right: 12px; top: 14px; bottom: 0; background: var(--card); border-radius: 24px; opacity: .55; }
.sw { position: relative; background: var(--card); border-radius: 24px; padding: 20px; display: grid; gap: 16px; box-shadow: var(--sh); touch-action: pan-y; user-select: none; -webkit-user-select: none; will-change: transform; margin-bottom: 14px; }
.stamp { position: absolute; top: 16px; right: 16px; font-size: 13px; font-weight: 700; color: #fff; padding: 5px 10px; border-radius: 8px; opacity: 0; transition: opacity .1s; pointer-events: none; z-index: 2; }
.src { display: flex; align-items: center; gap: 12px; min-width: 0; }
.src > div { min-width: 0; flex: 1; }
.sq { width: 40px; height: 40px; border-radius: 12px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 15px; font-weight: 600; flex: none; }
.src > div > b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src > div > span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.open { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 99px; background: var(--acc-soft); color: var(--acc); font-size: 13px; font-weight: 600; }
.open.off { background: var(--chip); color: var(--muted); }
.task { font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; overflow-wrap: anywhere; }
.quote { background: var(--bg); border-radius: 14px; padding: 12px 14px; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.f3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.f3 div, .f2 div { background: var(--bg); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.f3 div { padding: 10px; }
.f3 span, .f2 span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f3 b { display: block; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.f2 b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pp6 { display: flex; gap: 5px; align-items: center; font-size: 13px; color: var(--muted); }
.pp6 i { flex: 1; max-width: 28px; height: 6px; border-radius: 3px; background: var(--chip); }
.pp6 i.on { background: var(--ink); }
.pp6 span { margin-right: 6px; white-space: nowrap; }
.warn { font-size: 13px; color: var(--amb); background: var(--amb-soft); border-radius: 12px; padding: 10px 12px; }

.row { display: grid; grid-template-columns: 52px minmax(0, 1fr); background: var(--card); border-radius: 18px; min-height: 64px; width: 100%; }
.ck { display: grid; place-items: center; min-height: 64px; }
.ck i { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ring); display: grid; place-items: center; }
.ck svg { opacity: 0; }
.row.done .ck i { background: var(--acc); border-color: var(--acc); } .row.done .ck svg { opacity: 1; }
.rt { padding: 11px 14px 11px 0; display: grid; align-content: center; gap: 3px; min-width: 0; }
.rt .n { font-size: 15px; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.rt .m { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.done .n { text-decoration: line-through; color: var(--soft); }
.star { color: var(--acc); }
.pr { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--card); border-radius: 18px; min-height: 64px; padding: 10px 14px 10px 12px; width: 100%; }
.pr .n { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr .m { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr .n, .pr .m { display: block; }
.pr .x { display: grid; justify-items: end; gap: 4px; }
.pr .x span { font-size: 13px; color: var(--muted); white-space: nowrap; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; flex: none; background: var(--chip); color: var(--muted); }
.av.lg { width: 40px; height: 40px; font-size: 15px; }
.av.v { background: #EEE7FB; color: #5B37A8; } .av.a { background: var(--ink); color: var(--bg); } .av.s { background: var(--acc-soft); color: var(--acc); }
:root.dark .av.v { background: #2A2140; color: #B49BF0; }
.prw { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; background: var(--card); border-radius: 18px; min-height: 64px; padding-right: 10px; gap: 8px; }
.prw .pr { background: none; padding-right: 0; }
.mbtn { min-height: 44px; padding: 0 14px; border-radius: 99px; background: var(--acc-soft); color: var(--acc); font-size: 13px; font-weight: 600; white-space: nowrap; }
.mbtn.g { background: var(--bg); color: var(--ink); }

.nx { background: var(--acc-soft); border-radius: 22px; padding: 16px; display: grid; gap: 12px; }
.nx.amb { background: var(--amb-soft); } .nx.red { background: var(--red-soft); }
.nx .l { font-size: 13px; font-weight: 600; color: var(--acc); }
.nx.amb .l { color: var(--amb); } .nx.red .l { color: var(--red); }
.nx p { margin: 3px 0 0; font-size: 17px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
.nx .s { font-size: 15px; line-height: 1.4; color: var(--ink); opacity: .8; }
.nx .b { background: var(--card); border-color: transparent; }
.bc { background: var(--card); border-radius: 18px; padding: 14px; display: grid; gap: 6px; min-height: 64px; }
.bh { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bh i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--acc); }
.bh b { font-size: 13px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .bh span { font-size: 13px; color: var(--muted); white-space: nowrap; }
.bc p { margin: 0; line-height: 1.4; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--chip); border-radius: 14px; padding: 3px; }
.seg button { min-height: 44px; border-radius: 11px; font-size: 15px; font-weight: 600; color: var(--muted); text-align: center; padding: 0 12px; }
.seg button.on { background: var(--card); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 15px; font-weight: 500; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-flex; align-items: center; gap: 7px; }
.chips button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips i { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.shade { position: fixed; inset: 0; background: var(--shade); opacity: 0; pointer-events: none; transition: opacity .22s; z-index: 20; }
.shade.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; transform: translateY(105%); visibility: hidden; transition: transform .26s cubic-bezier(.2,.8,.2,1), visibility 0s linear .26s; max-height: 92vh; overflow-y: auto; }
.sheet.on { transform: translateY(0); visibility: visible; transition: transform .26s cubic-bezier(.2,.8,.2,1); }
.sheet .in { max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 24px 24px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 4px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--chip); margin: 0 auto 10px; }
.sheet h3 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
.sheet .s13 { margin-bottom: 6px; }
.opt { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; min-height: 64px; padding: 8px 2px; border-top: 1px solid var(--line); }
.opt:first-of-type { border-top: 0; }
.opt .oi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 17px; font-weight: 700; background: var(--bg); color: var(--ink); }
.opt .oi.blue { background: var(--acc-soft); color: var(--acc); } .opt .oi.red { background: var(--red-soft); color: var(--red); } .opt .oi.amb { background: var(--amb-soft); color: var(--amb); }
.opt b { display: block; font-size: 15px; font-weight: 600; }
.opt span span { display: block; font-size: 13px; color: var(--muted); }
.act1 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.act1:first-of-type { border-top: 0; }
.act1 b { font-size: 15px; font-weight: 600; } .act1 span { display: block; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }

.sbox { display: flex; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 0 14px; margin-bottom: 10px; }
.sbox input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; min-height: 52px; font-size: 17px; }
.back { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; background: var(--card); border-radius: 99px; padding: 0 18px 0 14px; min-height: 44px; margin-bottom: 12px; }
.pg { display: grid; gap: 10px; }
.card { background: var(--card); border-radius: 22px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.card h2 { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em; overflow-wrap: anywhere; }
.card h3 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.ch { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ch > div { min-width: 0; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
.fields span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; } .fields p { margin: 0; overflow-wrap: anywhere; }
.na { background: var(--bg); color: var(--muted); border-radius: 14px; padding: 12px 14px; grid-column: 1 / -1; }
.ed { display: grid; gap: 14px; }
.ed label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
.ed input, .ed textarea, .ed select { width: 100%; min-height: 52px; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 12px 14px; font-size: 17px; outline-offset: 2px; }
.ed textarea { min-height: 88px; resize: vertical; line-height: 1.35; }
.ed .quote { white-space: pre-wrap; }
.ed2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ed2 > div { min-width: 0; }

.card .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.card svg.bars { display: block; width: 100%; height: auto; overflow: visible; }
.card text { fill: var(--muted); font: 500 11.5px var(--f); }
.note0 { font-size: 13px; color: var(--soft); }
.colhit { cursor: pointer; }
.mdet { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 10px; }
.donut { display: flex; gap: 16px; align-items: center; }
.donut svg { width: 112px; height: 112px; flex: none; transform: rotate(-90deg); }
.leg { display: grid; gap: 8px; flex: 1; min-width: 0; }
.leg div { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.leg i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.leg b { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 520px) { .g2 { grid-template-columns: 1fr; } }
.feed { display: grid; }
.fday { font-size: 13px; font-weight: 600; color: var(--muted); margin: 10px 0 2px; }
.fi { display: grid; grid-template-columns: 40px 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 44px; font-size: 15px; width: 100%; }
.fi .tm { font-size: 13px; color: var(--soft); font-variant-numeric: tabular-nums; }
.fi .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb { display: grid; gap: 2px; }
.hbr { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 4px 10px; align-items: center; width: 100%; min-height: 44px; padding: 6px 0; }
.hbr .l { font-size: 15px; } .hbr .v { font-size: 15px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.hbr .bar { grid-column: 1 / -1; }
.hbr.on .l { font-weight: 600; }
.bar { height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; transform-origin: left; animation: gx .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes gx { from { transform: scaleX(.03); } }
.grp { font-size: 11.5px; font-weight: 700; color: var(--soft); text-transform: uppercase; letter-spacing: .07em; margin-top: 10px; }
.grow { animation: grow .7s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: bottom; }
@keyframes grow { from { transform: scaleY(.05); } }
.arc { animation: arc .9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes arc { from { stroke-dasharray: 0 999; } }
.pf { display: grid; }

    pfr('Витрати на рекламу', noMeta ? '—' : money(mo.spend), p.P_PLAN_BUDGET ? money(p.P_PLAN_BUDGET) : '', p.P_PLAN_BUDGET ? mo.spend / p.P_PLAN_BUDGET * 100 : 0, 'var(--ink)', noMeta ? 'нема даних з Meta' : '') +
    pfr('Ціна заявки з реклами', cpl ? money(cpl) : '—', p.P_REQ_PRICE ? money(p.P_REQ_PRICE) : '', cpl && p.P_REQ_PRICE ? cpl / p.P_REQ_PRICE * 100 : 0, cpl > p.P_REQ_PRICE ? 'var(--red)' : 'var(--ink)', noMeta ? 'нема даних з Meta' : !adsReq ? 'заявок з реклами ще немає' : '') +
    pfr('Ціна клієнта з реклами', cac ? money(cac) : '—', p.P_CAC_OK ? money(p.P_CAC_OK) : '', cac && p.P_CAC_OK ? cac / p.P_CAC_OK * 100 : 0, cac > p.P_CAC_OK ? 'var(--red)' : 'var(--ink)', p.P_CAC_MAX ? 'межа ' + money(p.P_CAC_MAX) + ', далі в мінус' : '') + '</div></div>';
  var from = isoOf(addD(t, -90)), inW = function (iso) { return iso && iso >= from && iso <= S.d.iso; };
  var F = [['Заявки', all.filter(function (l) { return inW(l.reqIso); }).length, 'var(--ring)'], ['Ліди', all.filter(function (l) { return inW(l.leadIso); }).length, 'var(--acc)'], ['Дзвінки', all.filter(function (l) { return inW(l.callIso); }).length, 'var(--ink)'], ['Офери', all.filter(function (l) { return inW(l.offerIso); }).length, 'var(--amb)'], ['Продажі', all.filter(function (l) { return inW(l.saleIso); }).length, 'var(--grn)']];
  var f0 = Math.max(1, F[0][1], F[1][1]);
  h += sec('воронка за 90 днів', 'з дат етапів у CRM') + '<div class="card"><div class="pf">' + F.map(function (f, i) { return '<div class="pfr"><span class="l">' + f[0] + '</span><span class="v">' + f[1] + (i && F[i - 1][1] ? ' <small>' + Math.round(f[1] / F[i - 1][1] * 100) + ' %</small>' : '') + '</span><span class="bar" style="height:12px"><i style="width:' + (f[1] / f0 * 100) + '%;background:' + f[2] + '"></i></span></div>'; }).join('') + '</div><div class="note0">З ' + ddmm(addD(t, -90)) + ' по сьогодні.' + (cr ? ' Ціль з «Параметрів»: заявка → клієнт ' + (cr * 100).toFixed(1).replace('.', ',') + ' %.' : '') + '</div></div>';
  var A = [];
  if (noc.length) A.push(nx('red', 'чеки', 'Вписати ' + pl(noc.length, 'чек', 'чеки', 'чеки') + ' ' + noc.length + ' ' + pl(noc.length, 'клієнту', 'клієнтам', 'клієнтам'), esc(noc.map(cname).join(', ')) + ' ' + pl(noc.length, 'стоїть', 'стоять', 'стоять') + ' у «Продаж» без суми. Хвилина роботи, і з\'явиться сума й середній чек.', '<button class="b" data-goto="leads:client">вписати</button>'));
  if (unc.length) A.push(nx('', 'клієнти', 'Звірити, з ким ще працюємо', 'У CRM ' + unc.length + ' ' + pl(unc.length, 'клієнт', 'клієнти', 'клієнтів') + ' у «Продаж» без підтвердження. Спершу відмітимо, з ким ще працюємо, потім чеки.', '<button class="b" data-actual="1">актуалізувати</button>'));
  if (!mo.meta) A.push(nx('amb', 'Meta', 'Підключити рекламу агенції', 'Потрібен токен Meta в налаштуваннях скрипта Sales Dep. Тоді оживуть витрати, ціна заявки і ціна клієнта.'));
  offers.forEach(function (l) { A.push(nx('amb', 'оффер', 'Дотиснути: ' + esc(l.n), 'Оффер' + (l.offerAt ? ' з ' + l.offerAt : '') + (l.c ? ', у коментарі «' + esc(l.c) + '»' : '') + '. Наступний пуш ' + (l.next || '—') + '.', '<button class="b" data-lead="' + l.id + '">відкрити</button>')); });
  h += sec('що зробити, щоб тут були гроші') + '<div class="list">' + (A.length ? A.join('') : empty('чисто', 'Чеки вписані, клієнти звірені.')) + '</div>';
  setApp(h);
}

function render(keep) { nav(); if (S.lead) return vLead(); if (S.tab === 'today') vToday(keep); else if (S.tab === 'leads') vLeads(keep); else if (S.tab === 'stats') vStats(keep); else vSales(keep); }
document.getElementById('shade').addEventListener('click', function () { closeSheet(); if (S.d && !S.lead) render(true); });
document.addEventListener('click', function (e) {
  if (!S.d) return;
  if (Date.now() - S.dragAt < 400) { e.preventDefault(); return; }
  var g = function (s) { return e.target.closest(s); }, b;
  if ((b = g('a[href]'))) return;
  if ((b = g('[data-search]'))) { S.tab = 'leads'; S.lead = null; S.search = ''; S.focusQ = true; try { localStorage.setItem('lg_tab', S.tab); } catch (z) {} return render(); }
  if ((b = g('[data-tab]'))) { S.tab = b.getAttribute('data-tab'); S.lead = null; closeSheet(); try { localStorage.setItem('lg_tab', S.tab); } catch (z) {} return render(); }
  if ((b = g('[data-goto]'))) { var p = b.getAttribute('data-goto').split(':'); S.tab = p[0]; S.seg = p[1]; S.search = ''; S.lead = null; closeSheet(); return render(); }
  if ((b = g('[data-lead]'))) { S.lead = b.getAttribute('data-lead'); closeSheet(); return render(); }
  if ((b = g('[data-back]'))) { S.lead = null; return render(); }
  if ((b = g('[data-act]'))) return decide(b.getAttribute('data-act') === 'yes');
  if ((b = g('[data-state]'))) return openSheet('main', b.getAttribute('data-state'));
  if ((b = g('[data-ans]'))) { S.sl = b.getAttribute('data-ans'); return act('ans', said('Відповіла', 'Відповів') + ': пуші з нуля, наступний завтра'); }
  if ((b = g('[data-np]'))) { var bx = document.getElementById('np-box'), ip = document.getElementById('e-next'); bx.hidden = false; b.hidden = true; try { ip.showPicker(); } catch (z) { ip.focus(); } return; }
  if ((b = g('[data-actual]'))) return openActual();
  if ((b = g('[data-keep]'))) { var kid = b.getAttribute('data-keep'); S.actd[kid] = 1; toast('Ок, працюємо'); send('keep', kid); if (S.more) openActual(); else { S.lead = null; render(); } return; }
  if ((b = g('[data-base]'))) { var bid = b.getAttribute('data-base'), bl = byId(bid); S.actd[bid] = 1; toast((bl ? bl.n : '') + ' → база колишніх клієнтів'); send('base', bid); if (S.more) openActual(); else { S.lead = null; render(); } return; }
  if ((b = g('[data-sheet]'))) return openSheet(b.getAttribute('data-sheet'));
  if ((b = g('[data-opt]'))) {
    var o = b.getAttribute('data-opt');
    if (o === 'lost' || o === 'date') return openSheet(o);
    var M = { ans: said('Відповіла', 'Відповів') + ': пуші з нуля, наступний завтра', call: 'Етап: дзвінок', offer: 'Етап: оффер' }[o];
    return act(o, M);
  }
  if ((b = g('[data-lost]'))) {
    var why = b.getAttribute('data-lost');
    if (S.afterLost && S.lead) { var x = S.afterLost; S.afterLost = null; closeSheet(); toast('Втрачено: ' + why.toLowerCase()); send('save', S.lead, x, function (ok) { if (ok) send('lost', S.lead, why, function (ok2) { if (ok2) { S.lead = null; render(); } }); }); return; }
    return act('lost', 'Втрачено: ' + why.toLowerCase(), why);
  }
  if ((b = g('[data-date]'))) { var dv = b.getAttribute('data-date'); return act('date', 'Пуш на ' + ddmm(isoDate(dv)), dv); }
  if ((b = g('[data-who]'))) { S.who = b.getAttribute('data-who'); var y = window.scrollY; vToday(true); window.scrollTo(0, y); return; }
  if ((b = g('[data-fall]'))) { S.feedAll = true; var y4 = window.scrollY; vStats(true); window.scrollTo(0, y4); return; }
  if ((b = g('[data-tall]'))) { S.tasksAll = true; var y3 = window.scrollY; vToday(true); window.scrollTo(0, y3); return; }
  if ((b = g('[data-task]'))) {
    var tid = b.getAttribute('data-task'), T = (S.d.tasks.list || []).filter(function (t) { return t.id === tid; })[0] || S.tclosed[tid];
    if (!T) return;
    var closing = !S.tclosed[tid];
    if (closing) S.tclosed[tid] = T; else delete S.tclosed[tid];
    toast(closing ? 'Закрито в Notion' : 'Знову відкрито');
    var y2 = window.scrollY; vToday(true); window.scrollTo(0, y2);
    send(closing ? 'task' : 'untask', tid, { n: T.n, prev: T.status }, function (ok) { if (!ok) { if (closing) delete S.tclosed[tid]; else S.tclosed[tid] = T; vToday(true); } });
    return;
  }
  if ((b = g('[data-seg]'))) {
    var sg = b.getAttribute('data-seg');
    if (b.hasAttribute('data-tile') && (S.seg === sg || (sg === 'pause' && S.seg === 'lost'))) sg = 'all';
    S.seg = sg; return vLeads(true);
  }
  if ((b = g('[data-month]'))) { S.month = b.getAttribute('data-month'); if (S.tab !== 'stats') { S.tab = 'stats'; S.lead = null; return render(); } return vStats(true); }
  if ((b = g('[data-why]'))) { S.why = b.getAttribute('data-why'); return vStats(true); }
  if ((b = g('[data-stp]'))) { S.stp = b.getAttribute('data-stp'); [].forEach.call(document.querySelectorAll('[data-stp]'), function (x) { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); }); return; }
  if ((b = g('[data-save]'))) return saveLead();
  if ((b = g('[data-sent]'))) { var sid = b.getAttribute('data-sent'); toast('Записав: ти написав у Telegram'); send('tg', sid, null, function (ok) { if (ok) { S.lead = null; render(); } }); return; }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.more) closeSheet(); });
function lum(hex) { var h = String(hex).replace('#', ''); return (0.299 * parseInt(h.substr(0, 2), 16) + 0.587 * parseInt(h.substr(2, 2), 16) + 0.114 * parseInt(h.substr(4, 2), 16)) / 255; }
function noAccess(ic, t, p, why) { setApp('<div class="noacc"><div class="ic">' + ic + '</div><h2>' + t + '</h2><p>' + p + '</p>' + (why ? '<small>' + esc(why) + '</small>' : '') + '</div>'); document.querySelector('nav').hidden = true; }
function start(hash) {
  var h = String(hash || '').replace(/^#/, ''), q = new URLSearchParams(h);
  var m = /(?:^|&)tgWebAppData=(.*?)(?=&tgWebApp[A-Za-z]+=|$)/.exec(h), raw = m ? m[1] : '';
  S.init = /%3D|%26/i.test(raw) ? decodeURIComponent(raw) : raw;
  try { var th = JSON.parse(q.get('tgWebAppThemeParams') || '{}'); if (th.bg_color) document.documentElement.classList.toggle('dark', lum(th.bg_color) < .5); } catch (e) { }
  if (!S.init) return noAccess('📊', 'Відкрий з Telegram', 'Кнопка «лідген» у чаті з ботом або закріп «📊 Лідген» у групі Follow up.', '');
  run('lgAppData', [S.init], function (d) {
    if (!d || !d.ok) {
      if (d && d.why === 'user') return noAccess('🔒', 'Тільки для команди продажів', 'Доступ мають учасники групи Follow up & Home Agency. Попроси Алекса додати тебе.', '');
      if (d && d.why === 'old') return noAccess('⏱', 'Вхід застарів', 'Вхід діє один день. Закрий застосунок і відкрий ще раз з Telegram.', '');
      return noAccess('⚠', 'Не вийшло увійти', 'Закрий застосунок і відкрий ще раз з Telegram.', d && (d.err || d.why) || '');
    }
    S.d = d; S.who = d.me && d.me.who === 'Алекс' ? 'Алекс' : 'Віка';
    document.querySelector('nav').hidden = false;
    render();
  }, function () { noAccess('⚠', 'Не завантажилось', 'Немає зв\'язку з таблицею. Закрий і відкрий ще раз.', ''); });
}
if (window.google && google.script && google.script.url) google.script.url.getLocation(function (loc) { start(loc.hash); });
else start(location.hash);
